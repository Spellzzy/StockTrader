<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Trader AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📈</span>
      <div>
        <h1>Stock Trader AI</h1>
        <span class="sub">本地可视化 · 数据仅供参考，不构成投资建议</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="status" class="status offline"><i></i>连接中</span>
      <span id="version" class="version"></span>
      <button id="refresh" class="btn ghost" title="刷新当前页">↻ 刷新</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="market">行情</button>
    <button class="tab" data-tab="reports">报告</button>
    <span class="tabs-note">仅监听 127.0.0.1 · 本机单用户</span>
  </nav>

  <main>
    <div id="alert" class="alert hidden"></div>

    <!-- 总览 -->
    <section id="panel-overview" class="panel">
      <div class="section-head">
        <h2>账户概览</h2>
        <span id="overview-time" class="dim"></span>
      </div>
      <div id="cards" class="cards"></div>
      <div id="warnings" class="warnings"></div>

      <div class="section-head"><h2>当前持仓</h2></div>
      <div class="table-wrap"><table id="holdings">
        <thead><tr><th>代码</th><th>名称</th><th class="num">持仓</th><th class="num">成本</th>
          <th class="num">现价</th><th class="num">市值</th><th class="num">浮动盈亏</th><th class="num">盈亏率</th></tr></thead>
        <tbody></tbody>
      </table></div>

      <div class="section-head"><h2>快捷信息</h2></div>
      <div id="meta-cards" class="cards small"></div>
    </section>

    <!-- 行情 -->
    <section id="panel-market" class="panel hidden">
      <div class="section-head"><h2>实时行情</h2><span class="dim">支持空格或逗号分隔多只股票</span></div>
      <div class="toolbar">
        <input id="codes" type="text" value="sh000001,sh600519,sz002555" placeholder="如 600519 000001 或 600519,000001">
        <button id="quote-btn" class="btn primary">查询</button>
      </div>
      <div class="table-wrap"><table id="quotes">
        <thead><tr><th>代码</th><th>名称</th><th class="num">现价</th><th class="num">涨跌幅</th>
          <th class="num">涨跌额</th><th class="num">今开</th><th class="num">最高</th><th class="num">最低</th></tr></thead>
        <tbody></tbody>
      </table></div>

      <div class="section-head"><h2>K 线走势</h2><span class="dim">收盘价折线，近 120 个交易日</span></div>
      <div class="toolbar">
        <input id="kline-code" type="text" value="sz002555" placeholder="股票代码">
        <button id="kline-btn" class="btn ghost">绘制</button>
      </div>
      <div id="chart" class="chart"><span class="dim">点击「绘制」查看走势</span></div>
    </section>

    <!-- 报告 -->
    <section id="panel-reports" class="panel hidden">
      <div class="section-head"><h2>已生成报告</h2><span class="dim">HTML 可直接打开；Markdown 为日报正文</span></div>
      <div id="report-list" class="report-list"></div>
    </section>
  </main>

  <footer>
    Stock Trader AI · 本地运行 · 所有数据来自本机 <code>data/stock_trader.db</code>
    <span> · 命令行仍可用：<code>stock-ai --help</code></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
